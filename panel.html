<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - GT Vive Vallarta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primario: '#0F4C81',
                        oscuro: '#083057',
                        fondo: '#000000',
                        texto: '#FFFFFF',
                        dorado: '#D4AF37',
                        exito: '#25D366'
                    }
                }
            }
        }
    </script>
    <style>
        .borde-dorado { border: 1px solid #D4AF3740; }
        .sombra-card { box-shadow: 0 0 15px #D4AF3720; }
    </style>
</head>
<body class="bg-fondo text-texto font-sans p-6">
    <div class="container mx-auto max-w-3xl">
        <h1 class="text-3xl font-bold text-dorado mb-8 text-center">📋 Reservas Recibidas</h1>
        
        <div id="cargando" class="text-center text-dorado text-xl py-10">Cargando reservas...</div>
        <div id="listaReservas" class="space-y-4 hidden"></div>
        <div id="sinReservas" class="text-center text-gray-400 text-xl py-10 hidden">Aún no hay reservas registradas.</div>
    </div>

    <script>

        function cargarReservas() {
            const contenedor = document.getElementById('listaReservas');
            const cargando = document.getElementById('cargando');
            const sinReservas = document.getElementById('sinReservas');

            // Obtener reservas guardadas
            const reservas = JSON.parse(localStorage.getItem('listaReservas') || '[]');

            cargando.classList.add('hidden');

            if (reservas.length === 0) {
                sinReservas.classList.remove('hidden');
                return;
            }

            contenedor.classList.remove('hidden');

            reservas.forEach((reserva, index) => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'bg-oscuro/40 p-5 rounded-lg borde-dorado sombra-card';
                tarjeta.innerHTML = `
                    <p><strong class="text-dorado">#${index+1} | 📅 Fecha:</strong> ${reserva.fechaRegistro || 'Sin fecha'}</p>
                    <p><strong class="text-dorado">👤 Titular:</strong> ${reserva.nombreTitular || 'Sin nombre'}</p>
                    <p><strong class="text-dorado">📞 Teléfono:</strong> ${reserva.telefono || 'Sin teléfono'}</p>
                    <p><strong class="text-dorado">🌍 Destino:</strong> ${reserva.destino || 'Sin destino'}</p>
                    <p><strong class="text-dorado">🚗 Viaje:</strong> ${reserva.fechaViaje || ''} a las ${reserva.horaViaje || ''}</p>
                    <p><strong class="text-dorado">👥 Acompañantes:</strong> ${reserva.pasajeros?.join(', ') || 'Ninguno'}</p>
                `;
                contenedor.appendChild(tarjeta);
            });
        }

        cargarReservas();
    </script>
    </script>
</body>
</html>
